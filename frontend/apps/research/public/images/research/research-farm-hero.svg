  <rect x="400" y="440" width="6" height="160" rx="2" fill="#4a6a9f" opacity="0.4"/>
  <line x1="403" y1="440" x2="360" y2="380" stroke="#4a6a9f" stroke-width="4" opacity="0.3"/>
  <line x1="403" y1="440" x2="450" y2="380" stroke="#4a6a9f" stroke-width="4" opacity="0.3"/>
  <line x1="403" y1="440" x2="403" y2="360" stroke="#4a6a9f" stroke-width="4" opacity="0.3"/>
