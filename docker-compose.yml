# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ksu:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:

services:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      main:
        condition: service_healthy
      research:
        condition: service_healthy
      library:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  # ── PostgreSQL (shared DB, separate schemas) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ksu
      POSTGRES_USER: ksu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksu -d ksu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (shared: cache + Celery queues) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Main Site Service (FastAPI) ────────────────────────────────────────────────
  main:
    build:
      context: ./services
      dockerfile: main/Dockerfile
    env_file: ./services/main/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-secret}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Research Service (FastAPI) ─────────────────────────────────────────────────
  research:
    build:
      context: ./services
      dockerfile: research/Dockerfile
    env_file: ./services/research/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-secret}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/2
      MAIN_SERVICE_URL: http://main:8000
      REFERENCE_VALIDATION_MODE: strict
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Library Service (FastAPI) ──────────────────────────────────────────────────
  library:
    build:
      context: ./services
      dockerfile: library/Dockerfile
    env_file: ./services/library/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-secret}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAIN_SERVICE_URL: http://main:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery workers ────────────────────────────────────────────────────────────
  celery-main:
    build:
      context: ./services
      dockerfile: main/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/main/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-secret}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  celery-library:
    build:
      context: ./services
      dockerfile: library/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/library/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-secret}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
