# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ksu:
    driver: bridge
  api:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data: # Durable Celery broker/result data (legacy volume name retained).
  uploads_data:
  prometheus_data:
  alertmanager_data:
  frontend_node_modules:
  frontend_pnpm_store:

secrets:
  alertmanager_config:
    file: ${ALERTMANAGER_CONFIG_FILE:-./monitoring/alertmanager.yml}

x-frontend-dev: &frontend-dev
  image: node:22-alpine
  working_dir: /app
  networks: [ksu]
  volumes:
    - ./frontend:/app
    - frontend_node_modules:/app/node_modules
    - frontend_pnpm_store:/root/.local/share/pnpm/store
  environment: &frontend-dev-env
    NEXT_TELEMETRY_DISABLED: "1"
    WATCHPACK_POLLING: "true"
    KSU_MAIN_API_URL: ${KSU_MAIN_API_URL:-http://main:8000}
    KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL:-http://research:8001}
    KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL:-http://library:8002}
    KSU_HERI_API_URL: ${KSU_HERI_API_URL:-http://heri:8003/api/v1/heri}
    KSU_HERI_FRONTEND_URL: ${KSU_HERI_FRONTEND_URL:-http://heri-web:3004}
    NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL:-http://localhost:${PUBLIC_FRONTEND_PORT:-3000}}
    NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL:-http://localhost:${RESEARCH_FRONTEND_PORT:-3002}}
    NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL:-http://localhost:${LIBRARY_FRONTEND_PORT:-3003}}
    NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-http://localhost:${HERI_SERVICE_PORT:-8003}/api/v1/heri}
    NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL: ${NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL:-/heri-africa}
    NEXT_PUBLIC_SCHOOL_PORTAL_ENABLED: ${NEXT_PUBLIC_SCHOOL_PORTAL_ENABLED:-true}
  restart: unless-stopped

# PostgreSQL connection budget (all values are Compose-level deployment inputs):
#   (4 API services * API_WORKERS + 4 Celery services * CELERY_CONCURRENCY)
#   * (DB_POOL_SIZE + DB_MAX_OVERFLOW) <=
#   POSTGRES_MAX_CONNECTIONS - POSTGRES_CONNECTION_RESERVE.
#
# Every Uvicorn worker and every Celery prefork child owns a separate SQLAlchemy
# engine/pool. Keep these variables coordinated when scaling either tier.
# Defaults: (4 * 2 + 4 * 1) * (5 + 0) = 60 <= 100 - 20 = 80.
x-backend-database-capacity: &backend-database-capacity
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
  DB_DEFAULT_CONCURRENCY: ${DB_DEFAULT_CONCURRENCY:-8}
  DB_DEFAULT_QUERY_BUDGET: ${DB_DEFAULT_QUERY_BUDGET:-40}
  DB_ROUTE_BUDGETS: ${DB_ROUTE_BUDGETS:-}
  KSU_CACHE_REDIS_FAILURE_MODE: ${KSU_CACHE_REDIS_FAILURE_MODE:-fallback}

# Bound shutdown and Docker's own log storage for every long-running backend
# process. Application files rotate independently in ksu_common.logging.
x-backend-operations: &backend-operations
  init: true
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    expose:
      - "80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/public-api-cache.inc:/etc/nginx/snippets/public-api-cache.inc:ro
      # Serves upload bytes after main authorizes them via X-Accel-Redirect.
      - uploads_data:/var/www/uploads:ro
    depends_on:
      main:
        condition: service_healthy
      research:
        condition: service_healthy
      library:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.31.0.2
      api:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  # ── PostgreSQL (shared DB, separate schemas) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ksu_services_db}
      POSTGRES_USER: ${POSTGRES_USER:-ksu_service_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MAIN_DB_USER: ${MAIN_DB_USER:-ksu_main}
      MAIN_DB_PASSWORD: ${MAIN_DB_PASSWORD:?MAIN_DB_PASSWORD is required}
      RESEARCH_DB_USER: ${RESEARCH_DB_USER:-ksu_research}
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?RESEARCH_DB_PASSWORD is required}
      LIBRARY_DB_USER: ${LIBRARY_DB_USER:-ksu_library}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?LIBRARY_DB_PASSWORD is required}
      HERI_DB_USER: ${HERI_DB_USER:-ksu_heri}
      HERI_DB_PASSWORD: ${HERI_DB_PASSWORD:?HERI_DB_PASSWORD is required}
      # Kept explicit for deployment capacity validation; the Compose budget
      # holds it back for migrations, exporters, and administration.
      POSTGRES_CONNECTION_RESERVE: ${POSTGRES_CONNECTION_RESERVE:-20}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-database-ownership.sh:/docker-entrypoint-initdb.d/10-database-ownership.sh:ro
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ksu_service_user} -d ${POSTGRES_DB:-ksu_services_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis broker (durable Celery queues/results; never evict) ─────────────────
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_BROKER_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache/rate-limit data is disposable and may be evicted under pressure.
  redis-cache:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - ${REDIS_CACHE_MAXMEMORY_POLICY:-allkeys-lru}
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Main Site Service (FastAPI) ────────────────────────────────────────────────
  main:
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/main:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: main/Dockerfile
    expose:
      - "8000"
    env_file: ./services/main/.env
    command: ["uvicorn", "wsgi:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2", "--workers", "${API_WORKERS:-2}"]
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      KSU_RELEASE: ${KSU_RELEASE:-unknown}
      DEBUG: "false"
      JWT_SIGNING_ENABLED: "true"
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?JWT_PRIVATE_KEY_B64 is required}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      DATABASE_URL: postgresql+asyncpg://${MAIN_DB_USER:-ksu_main}:${MAIN_DB_PASSWORD:?MAIN_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: main
      INTERNAL_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      # The gateway serves upload bytes from the shared volume; main only
      # authorizes the request and points nginx at the file.
      MEDIA_INTERNAL_REDIRECT_PREFIX: /internal-uploads
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-395}
      IDEMPOTENCY_RETENTION_DAYS: ${IDEMPOTENCY_RETENTION_DAYS:-30}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}
      REDIS_URL: ${MAIN_REDIS_URL:-redis://redis-cache:6379/0}
      CACHE_REDIS_URL: ${MAIN_CACHE_REDIS_URL:-redis://redis-cache:6379/0}
      CELERY_BROKER_URL: ${MAIN_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${MAIN_CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      RESEARCH_SERVICE_URL: http://research:8001
      LIBRARY_SERVICE_URL: http://library:8002
      RESEARCH_SERVICE_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      LIBRARY_SERVICE_API_KEY: ${LIBRARY_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      REALTIME_HEARTBEAT_SECONDS: ${REALTIME_HEARTBEAT_SECONDS:-25}
      REALTIME_MAX_CONNECTIONS_PER_USER: ${REALTIME_MAX_CONNECTIONS_PER_USER:-5}
      REALTIME_MAX_CONNECTIONS_PER_IP: ${REALTIME_MAX_CONNECTIONS_PER_IP:-20}
      REALTIME_QUEUE_SIZE: ${REALTIME_QUEUE_SIZE:-100}
      SCHOOL_PORTAL_ROUTES_ENABLED: ${SCHOOL_PORTAL_ROUTES_ENABLED:-true}
      SCHOOL_PORTAL_EVENTS_ENABLED: ${SCHOOL_PORTAL_EVENTS_ENABLED:-true}
      SCHOOL_PORTAL_WEBSOCKET_FANOUT_ENABLED: ${SCHOOL_PORTAL_WEBSOCKET_FANOUT_ENABLED:-true}
      LOG_DIR: /app/logs
    volumes:
      - uploads_data:/app/uploads
      - ./logs/main:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      ksu:
      api:
        ipv4_address: 172.30.0.3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Research Service (FastAPI) ─────────────────────────────────────────────────
  research:
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/research:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: research/Dockerfile
    expose:
      - "8001"
    env_file: ./services/research/.env
    command: ["uvicorn", "wsgi:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2", "--workers", "${API_WORKERS:-2}"]
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      KSU_RELEASE: ${KSU_RELEASE:-unknown}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_ALGORITHM: RS256
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      DATABASE_URL: postgresql+asyncpg://${RESEARCH_DB_USER:-ksu_research}:${RESEARCH_DB_PASSWORD:?RESEARCH_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: research
      REDIS_URL: ${RESEARCH_REDIS_URL:-redis://redis-cache:6379/2}
      CACHE_REDIS_URL: ${RESEARCH_CACHE_REDIS_URL:-redis://redis-cache:6379/2}
      CELERY_BROKER_URL: ${RESEARCH_CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${RESEARCH_CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      REFERENCE_VALIDATION_MODE: strict
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      LOG_LEVEL: ${RESEARCH_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${RESEARCH_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
      EXPORT_DIR: /app/exports
    volumes:
      - ./logs/research:/app/logs
      - ./uploads/research-exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      main:
        condition: service_healthy
    networks:
      ksu:
      api:
        ipv4_address: 172.30.0.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── HERI Africa Service (FastAPI) ─────────────────────────────────────────
  heri:
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/heri-africa:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: heri_africa/Dockerfile
    expose:
      - "8003"
    env_file: ./services/heri_africa/.env
    command: ["uvicorn", "wsgi:app", "--host", "0.0.0.0", "--port", "8003", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2", "--workers", "${API_WORKERS:-2}"]
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      KSU_RELEASE: ${KSU_RELEASE:-unknown}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_ALGORITHM: RS256
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      DATABASE_URL: postgresql+asyncpg://${HERI_DB_USER:-ksu_heri}:${HERI_DB_PASSWORD:?HERI_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: heri
      REDIS_URL: ${HERI_REDIS_URL:-redis://redis-cache:6379/3}
      CACHE_REDIS_URL: ${HERI_CACHE_REDIS_URL:-redis://redis-cache:6379/3}
      CELERY_BROKER_URL: ${HERI_CELERY_BROKER_URL:-redis://redis:6379/3}
      CELERY_RESULT_BACKEND: ${HERI_CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      RESEARCH_SERVICE_URL: ${HERI_RESEARCH_SERVICE_URL:-http://research:8001}
      RESEARCH_SERVICE_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      LOG_LEVEL: ${HERI_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${HERI_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/heri:/app/logs
      - ./uploads/heri:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      ksu:
      api:
        ipv4_address: 172.30.0.6
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/heri/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Library Service (FastAPI) ──────────────────────────────────────────────────
  library:
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/library:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: library/Dockerfile
    expose:
      - "8002"
    env_file: ./services/library/.env
    command: ["uvicorn", "wsgi:app", "--host", "0.0.0.0", "--port", "8002", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2", "--workers", "${API_WORKERS:-2}"]
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      KSU_RELEASE: ${KSU_RELEASE:-unknown}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_ALGORITHM: RS256
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      DATABASE_URL: postgresql+asyncpg://${LIBRARY_DB_USER:-ksu_library}:${LIBRARY_DB_PASSWORD:?LIBRARY_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: library
      REDIS_URL: ${LIBRARY_REDIS_URL:-redis://redis-cache:6379/1}
      CACHE_REDIS_URL: ${LIBRARY_CACHE_REDIS_URL:-redis://redis-cache:6379/1}
      CELERY_BROKER_URL: ${LIBRARY_CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${LIBRARY_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${LIBRARY_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      LOG_LEVEL: ${LIBRARY_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LIBRARY_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/library:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      main:
        condition: service_healthy
    networks:
      ksu:
      api:
        ipv4_address: 172.30.0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery workers ────────────────────────────────────────────────────────────
  celery-main: &celery-main-service
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/main:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: main/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/main/.env
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      JWT_SIGNING_ENABLED: "false"
      JWT_PRIVATE_KEY_B64: ""
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_ALGORITHM: RS256
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      DEBUG: "false"
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      DATABASE_URL: postgresql+asyncpg://${MAIN_DB_USER:-ksu_main}:${MAIN_DB_PASSWORD:?MAIN_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: main
      REDIS_URL: ${MAIN_REDIS_URL:-redis://redis-cache:6379/0}
      CELERY_BROKER_URL: ${MAIN_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${MAIN_CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INTERNAL_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      RESEARCH_SERVICE_URL: http://research:8001
      LIBRARY_SERVICE_URL: http://library:8002
      RESEARCH_SERVICE_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      LIBRARY_SERVICE_API_KEY: ${LIBRARY_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      SCHOOL_PORTAL_EVENTS_ENABLED: ${SCHOOL_PORTAL_EVENTS_ENABLED:-true}
      KSU_WORKER_METRICS_HOST: 0.0.0.0
      KSU_WORKER_METRICS_PORT: 9100
      PROMETHEUS_MULTIPROC_DIR: /tmp/ksu-prometheus
      KSU_WORKER_METRICS_REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
    expose:
      - "9100"
    volumes:
      - ./logs/main:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  beat-main:
    <<: *celery-main-service
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO}
    expose: []

  celery-main-integrations:
    <<: *celery-main-service
    command: >-
      celery -A app.tasks.celery_app.celery_app worker
      --loglevel=${CELERY_LOG_LEVEL:-INFO}
      --concurrency=${CELERY_INTEGRATION_CONCURRENCY:-2}
      --queues=main.integrations
    expose: []

  celery-library: &celery-library-service
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/library:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: library/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/library/.env
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_ALGORITHM: RS256
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      DATABASE_URL: postgresql+asyncpg://${LIBRARY_DB_USER:-ksu_library}:${LIBRARY_DB_PASSWORD:?LIBRARY_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: library
      REDIS_URL: ${LIBRARY_REDIS_URL:-redis://redis-cache:6379/1}
      CELERY_BROKER_URL: ${LIBRARY_CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${LIBRARY_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${LIBRARY_INTERNAL_API_KEY:-}
      KSU_WORKER_METRICS_HOST: 0.0.0.0
      KSU_WORKER_METRICS_PORT: 9101
      PROMETHEUS_MULTIPROC_DIR: /tmp/ksu-prometheus
      KSU_WORKER_METRICS_REDIS_URL: redis://redis:6379/1
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      LOG_DIR: /app/logs
    expose:
      - "9101"
    volumes:
      - ./logs/library:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  beat-library:
    <<: *celery-library-service
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=${CELERY_LOG_LEVEL:-INFO}
    expose: []

  celery-research:
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/research:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: research/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/research/.env
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_ALGORITHM: RS256
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      DATABASE_URL: postgresql+asyncpg://${RESEARCH_DB_USER:-ksu_research}:${RESEARCH_DB_PASSWORD:?RESEARCH_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: research
      REDIS_URL: ${RESEARCH_REDIS_URL:-redis://redis-cache:6379/2}
      CELERY_BROKER_URL: ${RESEARCH_CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${RESEARCH_CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      REFERENCE_VALIDATION_MODE: strict
      KSU_WORKER_METRICS_HOST: 0.0.0.0
      KSU_WORKER_METRICS_PORT: 9102
      PROMETHEUS_MULTIPROC_DIR: /tmp/ksu-prometheus
      KSU_WORKER_METRICS_REDIS_URL: redis://redis:6379/2
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      LOG_DIR: /app/logs
      EXPORT_DIR: /app/exports
    volumes:
      - ./logs/research:/app/logs
      - ./uploads/research-exports:/app/exports
    expose:
      - "9102"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  celery-heri:
    <<: *backend-operations
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/heri-africa:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: heri_africa/Dockerfile
    command: >-
      sh -c 'if [ -n "$${PROMETHEUS_MULTIPROC_DIR:-}" ]; then
      mkdir -p "$$PROMETHEUS_MULTIPROC_DIR" &&
      find "$$PROMETHEUS_MULTIPROC_DIR" -mindepth 1 -maxdepth 1 -delete;
      fi; exec celery -A app.tasks.celery_app.celery_app worker
      --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
      --concurrency="$${CELERY_CONCURRENCY:-1}"'
    env_file: ./services/heri_africa/.env
    environment:
      <<: *backend-database-capacity
      APP_ENV: ${APP_ENV:-production}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_ALGORITHM: RS256
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      DATABASE_URL: postgresql+asyncpg://${HERI_DB_USER:-ksu_heri}:${HERI_DB_PASSWORD:?HERI_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      DB_SCHEMA: heri
      REDIS_URL: ${HERI_REDIS_URL:-redis://redis-cache:6379/3}
      CELERY_BROKER_URL: ${HERI_CELERY_BROKER_URL:-redis://redis:6379/3}
      CELERY_RESULT_BACKEND: ${HERI_CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      RESEARCH_SERVICE_URL: http://research:8001
      RESEARCH_SERVICE_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      KSU_WORKER_METRICS_HOST: 0.0.0.0
      KSU_WORKER_METRICS_PORT: 9103
      PROMETHEUS_MULTIPROC_DIR: /tmp/ksu-prometheus
      KSU_WORKER_METRICS_REDIS_URL: redis://redis:6379/3
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003","http://localhost:3004"]}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/heri:/app/logs
      - ./uploads/heri:/app/uploads
    expose:
      - "9103"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      ksu:
      api:
        # Keep the gateway's trusted proxy address (172.30.0.2) available when
        # observability services start before the gateway after a reboot.
        ipv4_address: 172.30.0.7
    depends_on:
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [observability]
    user: "65534:${ALERTMANAGER_CONFIG_GID:-1000}"
    command:
      - --config.file=/run/secrets/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    secrets:
      - source: alertmanager_config
        target: alertmanager.yml
    volumes:
      - alertmanager_data:/alertmanager
    networks: [ksu]
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: [observability]
    environment:
      # Set POSTGRES_EXPORTER_* in deployment secrets. The application
      # credential fallback is for local development only.
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-ksu_services_db}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-${POSTGRES_USER:-ksu_service_user}}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
    command:
      - --config.file=/etc/postgres_exporter/postgres_exporter.yml
      - --extend.query-path=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./monitoring/postgres-exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
      - ./monitoring/postgres-queries.yml:/etc/postgres_exporter/queries.yaml:ro
    networks: [ksu]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.65.0
    profiles: [observability]
    command:
      - --redis.addr=redis://redis:6379
    networks: [ksu]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis-cache-exporter:
    image: oliver006/redis_exporter:v1.65.0
    profiles: [observability]
    command:
      - --redis.addr=redis://redis-cache:6379
    networks: [ksu]
    depends_on:
      redis-cache:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend dev servers ────────────────────────────────────────────────────
  web:
    <<: *frontend-dev
    profiles: ["main", "frontend", "all"]
    ports:
      - "${PUBLIC_FRONTEND_PORT:-3000}:3000"
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/web exec next dev -H 0.0.0.0 -p ${PUBLIC_FRONTEND_PORT:-3000}"

  admin:
    <<: *frontend-dev
    profiles: ["main", "frontend", "all"]
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:3001"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      KSU_MAIN_API_URL: ${KSU_MAIN_API_URL:-http://main:8000}
      KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL:-http://research:8001}
      KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL:-http://library:8002}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-KSU Admin}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${ADMIN_FRONTEND_PORT:-3001}}
      NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-http://localhost:${GATEWAY_PORT:-8080}/api/v1/heri}
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/admin exec next dev -H 0.0.0.0 -p ${ADMIN_FRONTEND_PORT:-3001}"

  research-web:
    <<: *frontend-dev
    profiles: ["research", "frontend", "all"]
    ports:
      - "${RESEARCH_FRONTEND_PORT:-3002}:3002"
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/research exec next dev -H 0.0.0.0 -p ${RESEARCH_FRONTEND_PORT:-3002}"

  heri-web:
    <<: *frontend-dev
    profiles: ["heri", "frontend", "all"]
    ports:
      - "${HERI_FRONTEND_PORT:-3004}:3004"
    environment:
      NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-http://localhost:${GATEWAY_PORT:-8080}/api/v1/heri}
      <<: *frontend-dev-env
      NEXT_BASE_PATH: /heri-africa
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/heri-africa exec next dev -H 0.0.0.0 -p ${HERI_FRONTEND_PORT:-3004}"

  library-web:
    <<: *frontend-dev
    profiles: ["library", "frontend", "all"]
    ports:
      - "${LIBRARY_FRONTEND_PORT:-3003}:3003"
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/library exec next dev -H 0.0.0.0 -p ${LIBRARY_FRONTEND_PORT:-3003}"
