# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ksu:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  frontend_node_modules:
  frontend_pnpm_store:

x-frontend-dev: &frontend-dev
  image: node:22-alpine
  working_dir: /app
  network_mode: host
  volumes:
    - ./frontend:/app
    - frontend_node_modules:/app/node_modules
    - frontend_pnpm_store:/root/.local/share/pnpm/store
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    WATCHPACK_POLLING: "true"
    NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL:-http://localhost:${MAIN_SERVICE_PORT:-8000}}
    NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:${RESEARCH_SERVICE_PORT:-8001}}
    NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL:-http://localhost:${LIBRARY_SERVICE_PORT:-8002}}
    NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL:-http://localhost:${PUBLIC_FRONTEND_PORT:-3000}}
    NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL:-http://localhost:${RESEARCH_FRONTEND_PORT:-3002}}
    NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL:-http://localhost:${LIBRARY_FRONTEND_PORT:-3003}}
  restart: unless-stopped

services:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      main:
        condition: service_healthy
      research:
        condition: service_healthy
      library:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  # ── PostgreSQL (shared DB, separate schemas) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ksu
      POSTGRES_USER: ksu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksu -d ksu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (shared: cache + Celery queues) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Main Site Service (FastAPI) ────────────────────────────────────────────────
  main:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/main:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: main/Dockerfile
    ports:
      - "${MAIN_SERVICE_PORT:-8000}:8000"
    env_file: ./services/main/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-change-me-local-postgres-password}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RESEARCH_SERVICE_URL: http://research:8001
      LOG_DIR: /app/logs
    volumes:
      - uploads_data:/app/uploads
      - ./logs/main:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Research Service (FastAPI) ─────────────────────────────────────────────────
  research:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/research:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: research/Dockerfile
    ports:
      - "${RESEARCH_SERVICE_PORT:-8001}:8001"
    env_file: ./services/research/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-change-me-local-postgres-password}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/2
      MAIN_SERVICE_URL: http://main:8000
      REFERENCE_VALIDATION_MODE: strict
      LOG_LEVEL: ${RESEARCH_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${RESEARCH_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/research:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Library Service (FastAPI) ──────────────────────────────────────────────────
  library:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/library:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: library/Dockerfile
    ports:
      - "${LIBRARY_SERVICE_PORT:-8002}:8002"
    env_file: ./services/library/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-change-me-local-postgres-password}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAIN_SERVICE_URL: http://main:8000
      LOG_LEVEL: ${LIBRARY_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LIBRARY_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/library:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery workers ────────────────────────────────────────────────────────────
  celery-main:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/main:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: main/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/main/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-change-me-local-postgres-password}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LOG_DIR: /app/logs
    volumes:
      - ./logs/main:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  celery-library:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/library:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: library/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/library/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksu:${POSTGRES_PASSWORD:-change-me-local-postgres-password}@postgres:5432/ksu
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_DIR: /app/logs
    volumes:
      - ./logs/library:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  # ── Frontend dev servers ────────────────────────────────────────────────────
  web:
    <<: *frontend-dev
    profiles: ["main", "frontend", "all"]
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/web exec next dev -H 0.0.0.0 -p ${PUBLIC_FRONTEND_PORT:-3000}"

  admin:
    <<: *frontend-dev
    profiles: ["main", "frontend", "all"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      MAIN_API_URL: ${MAIN_API_URL:-http://localhost:${MAIN_SERVICE_PORT:-8000}}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-KSU Admin}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${ADMIN_FRONTEND_PORT:-3001}}
      NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL:-http://localhost:${MAIN_SERVICE_PORT:-8000}}
      NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:${RESEARCH_SERVICE_PORT:-8001}}
      NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL:-http://localhost:${LIBRARY_SERVICE_PORT:-8002}}
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/admin exec next dev -H 0.0.0.0 -p ${ADMIN_FRONTEND_PORT:-3001}"

  research-web:
    <<: *frontend-dev
    profiles: ["research", "frontend", "all"]
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/research exec next dev -H 0.0.0.0 -p ${RESEARCH_FRONTEND_PORT:-3002}"

  library-web:
    <<: *frontend-dev
    profiles: ["library", "frontend", "all"]
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/library exec next dev -H 0.0.0.0 -p ${LIBRARY_FRONTEND_PORT:-3003}"
