# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ksu:
    driver: bridge
  api:
    driver: bridge
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  frontend_node_modules:
  frontend_pnpm_store:

x-frontend-dev: &frontend-dev
  image: node@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43bb9c86130c3e2
  working_dir: /app
  networks: [ksu]
  volumes:
    - ./frontend:/app
    - frontend_node_modules:/app/node_modules
    - frontend_pnpm_store:/root/.local/share/pnpm/store
  environment: &frontend-dev-env
    NEXT_TELEMETRY_DISABLED: "1"
    WATCHPACK_POLLING: "true"
    KSU_MAIN_API_URL: ${KSU_MAIN_API_URL:-http://main:8000}
    KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL:-http://research:8001}
    KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL:-http://library:8002}
    KSU_HERI_API_URL: ${KSU_HERI_API_URL:-http://heri:8003/api/v1/heri}
    KSU_HERI_FRONTEND_URL: ${KSU_HERI_FRONTEND_URL:-http://heri-web:3004}
    NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL:-http://localhost:${PUBLIC_FRONTEND_PORT:-3000}}
    NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL:-http://localhost:${RESEARCH_FRONTEND_PORT:-3002}}
    NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL:-http://localhost:${LIBRARY_FRONTEND_PORT:-3003}}
    NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-http://localhost:${HERI_SERVICE_PORT:-8003}/api/v1/heri}
    NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL: ${NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL:-/heri-africa}
    NEXT_PUBLIC_SCHOOL_PORTAL_ENABLED: ${NEXT_PUBLIC_SCHOOL_PORTAL_ENABLED:-true}
  restart: unless-stopped

services:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    expose:
      - "80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      main:
        condition: service_healthy
      research:
        condition: service_healthy
      library:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.31.0.2
      api:
    restart: unless-stopped

  # ── PostgreSQL (shared DB, separate schemas) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ksu_services_db}
      POSTGRES_USER: ${POSTGRES_USER:-ksu_service_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ksu_service_user} -d ${POSTGRES_DB:-ksu_services_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (shared: cache + Celery queues) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [ksu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Main Site Service (FastAPI) ────────────────────────────────────────────────
  main:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/main:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: main/Dockerfile
    expose:
      - "8000"
    env_file: ./services/main/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      INTERNAL_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RESEARCH_SERVICE_URL: http://research:8001
      LIBRARY_SERVICE_URL: http://library:8002
      RESEARCH_SERVICE_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      LIBRARY_SERVICE_API_KEY: ${LIBRARY_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REALTIME_HEARTBEAT_SECONDS: ${REALTIME_HEARTBEAT_SECONDS:-25}
      REALTIME_MAX_CONNECTIONS_PER_USER: ${REALTIME_MAX_CONNECTIONS_PER_USER:-5}
      REALTIME_MAX_CONNECTIONS_PER_IP: ${REALTIME_MAX_CONNECTIONS_PER_IP:-20}
      REALTIME_QUEUE_SIZE: ${REALTIME_QUEUE_SIZE:-100}
      SCHOOL_PORTAL_ROUTES_ENABLED: ${SCHOOL_PORTAL_ROUTES_ENABLED:-true}
      SCHOOL_PORTAL_EVENTS_ENABLED: ${SCHOOL_PORTAL_EVENTS_ENABLED:-true}
      SCHOOL_PORTAL_WEBSOCKET_FANOUT_ENABLED: ${SCHOOL_PORTAL_WEBSOCKET_FANOUT_ENABLED:-true}
      LOG_DIR: /app/logs
    volumes:
      - uploads_data:/app/uploads
      - ./logs/main:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu, api]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Research Service (FastAPI) ─────────────────────────────────────────────────
  research:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/research:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: research/Dockerfile
    expose:
      - "8001"
    env_file: ./services/research/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      REDIS_URL: redis://redis:6379/2
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      REFERENCE_VALIDATION_MODE: strict
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${RESEARCH_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${RESEARCH_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
      EXPORT_DIR: /app/exports
    volumes:
      - ./logs/research:/app/logs
      - ./uploads/research-exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu, api]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── HERI Africa Service (FastAPI) ─────────────────────────────────────────
  heri:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/heri-africa:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: heri_africa/Dockerfile
    expose:
      - "8003"
    env_file: ./services/heri_africa/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RESEARCH_SERVICE_URL: ${HERI_RESEARCH_SERVICE_URL:-http://research:8001}
      RESEARCH_SERVICE_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${HERI_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${HERI_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/heri:/app/logs
      - ./uploads/heri:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu, api]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/heri/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Library Service (FastAPI) ──────────────────────────────────────────────────
  library:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/library:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: library/Dockerfile
    expose:
      - "8002"
    env_file: ./services/library/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${LIBRARY_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LIBRARY_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LIBRARY_LOG_FORMAT:-json}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/library:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu, api]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery workers ────────────────────────────────────────────────────────────
  celery-main:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/main:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: main/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/main/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      INTERNAL_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      RESEARCH_SERVICE_URL: http://research:8001
      LIBRARY_SERVICE_URL: http://library:8002
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SCHOOL_PORTAL_EVENTS_ENABLED: ${SCHOOL_PORTAL_EVENTS_ENABLED:-true}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/main:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  celery-library:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/library:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: library/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/library/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/library:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  celery-research:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/research:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: research/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/research/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: ${MAIN_INTERNAL_API_KEY:-}
      INTERNAL_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      REFERENCE_VALIDATION_MODE: strict
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_DIR: /app/logs
      EXPORT_DIR: /app/exports
    volumes:
      - ./logs/research:/app/logs
      - ./uploads/research-exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  celery-heri:
    image: ${BACKEND_IMAGE_PREFIX:-ksu-backend}/heri-africa:${IMAGE_TAG:-local}
    build:
      context: ./services
      dockerfile: heri_africa/Dockerfile
    command: ./scripts/start-celery-worker.sh
    env_file: ./services/heri_africa/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ksu_service_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ksu_services_db}
      REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RESEARCH_SERVICE_URL: http://research:8001
      RESEARCH_SERVICE_API_KEY: ${RESEARCH_INTERNAL_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_DIR: /app/logs
    volumes:
      - ./logs/heri:/app/logs
      - ./uploads/heri:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  # ── Frontend dev servers ────────────────────────────────────────────────────
  web:
    <<: *frontend-dev
    profiles: ["main", "frontend", "all"]
    ports:
      - "${PUBLIC_FRONTEND_PORT:-3000}:3000"
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/web exec next dev -H 0.0.0.0 -p ${PUBLIC_FRONTEND_PORT:-3000}"

  admin:
    <<: *frontend-dev
    profiles: ["main", "frontend", "all"]
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:3001"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      KSU_MAIN_API_URL: ${KSU_MAIN_API_URL:-http://main:8000}
      KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL:-http://research:8001}
      KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL:-http://library:8002}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-KSU Admin}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${ADMIN_FRONTEND_PORT:-3001}}
      NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/admin exec next dev -H 0.0.0.0 -p ${ADMIN_FRONTEND_PORT:-3001}"

  research-web:
    <<: *frontend-dev
    profiles: ["research", "frontend", "all"]
    ports:
      - "${RESEARCH_FRONTEND_PORT:-3002}:3002"
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/research exec next dev -H 0.0.0.0 -p ${RESEARCH_FRONTEND_PORT:-3002}"

  heri-web:
    <<: *frontend-dev
    profiles: ["heri", "frontend", "all"]
    ports:
      - "${HERI_FRONTEND_PORT:-3004}:3004"
    environment:
      <<: *frontend-dev-env
      NEXT_BASE_PATH: /heri-africa
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/heri-africa exec next dev -H 0.0.0.0 -p ${HERI_FRONTEND_PORT:-3004}"

  library-web:
    <<: *frontend-dev
    profiles: ["library", "frontend", "all"]
    ports:
      - "${LIBRARY_FRONTEND_PORT:-3003}:3003"
    command: >
      sh -lc "set -e &&
      corepack enable &&
      corepack prepare pnpm@9.1.0 --activate &&
      while ! mkdir /app/node_modules/.pnpm-install.lock 2>/dev/null; do sleep 1; done &&
      trap 'rmdir /app/node_modules/.pnpm-install.lock' EXIT &&
      pnpm install --frozen-lockfile &&
      rmdir /app/node_modules/.pnpm-install.lock &&
      trap - EXIT &&
      pnpm --dir apps/library exec next dev -H 0.0.0.0 -p ${LIBRARY_FRONTEND_PORT:-3003}"
