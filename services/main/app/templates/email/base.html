<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,sans-serif;color:#1f2937;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
    <div style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;border:1px solid #e2e8f0;">
      {{ logo_block }}
      {{ body_content }}
      <hr style="border:none;border-top:1px solid #e2e8f0;margin:32px 0 24px;" />
      <p style="margin:0;font-size:14px;color:#64748b;">{{ footer_text }}</p>
    </div>
  </body>
</html>
