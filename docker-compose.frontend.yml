# Frontend-only development stack.
#
# Standalone — it references no backend service, so it needs none of the database
# passwords or secrets that docker-compose.yml requires just to parse. Name a
# service to run exactly one app; omit the name to run all five:
#
#   docker compose -f docker-compose.frontend.yml up web
#   docker compose -f docker-compose.frontend.yml up
#
# The apps boot without a backend. Anything that fetches data stays empty or
# errors until an API is reachable at the URLs below.
name: ksu-frontend

networks:
  frontend:

volumes:
  # Literal names, not project-prefixed, so the workspace install is shared with
  # the full stack in docker-compose.yml instead of being repeated here.
  node_modules:
    name: ksu-website_frontend_node_modules
  pnpm_store:
    name: ksu-website_frontend_pnpm_store

x-frontend-app: &frontend-app
  image: node:22-alpine
  working_dir: /app
  networks: [frontend]
  # Lets server-side fetches reach a backend running on the host, whether it was
  # started by docker-compose.yml or natively.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./frontend:/app
    - ./scripts/frontend-dev.sh:/usr/local/bin/frontend-dev:ro
    - node_modules:/app/node_modules
    - pnpm_store:/root/.local/share/pnpm/store
  command: ["/usr/local/bin/frontend-dev"]
  # Resume after container crashes, Docker daemon restarts, and machine reboots.
  # An intentional `docker stop` remains stopped until explicitly started again.
  restart: unless-stopped

x-frontend-env: &frontend-env
  NEXT_TELEMETRY_DISABLED: "1"
  WATCHPACK_POLLING: "true"
  # Server-side (inside the container) — the API gateway published on the host.
  KSU_MAIN_API_URL: ${KSU_MAIN_API_URL:-http://host.docker.internal:${GATEWAY_PORT:-8080}}
  KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL:-http://host.docker.internal:${GATEWAY_PORT:-8080}}
  KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL:-http://host.docker.internal:${GATEWAY_PORT:-8080}}
  KSU_HERI_API_URL: ${KSU_HERI_API_URL:-http://host.docker.internal:${GATEWAY_PORT:-8080}/api/v1/heri}
  # Browser-side — resolved by the user's browser, so always localhost.
  NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
  NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
  NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL:-http://localhost:${GATEWAY_PORT:-8080}}
  NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-http://localhost:${GATEWAY_PORT:-8080}/api/v1/heri}
  # Cross-app links, so the redirects in apps/web/next.config.ts land locally
  # instead of on the production hostnames.
  NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL:-http://localhost:${PUBLIC_FRONTEND_PORT:-3000}}
  NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL:-http://localhost:${RESEARCH_FRONTEND_PORT:-3002}}
  NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL:-http://localhost:${LIBRARY_FRONTEND_PORT:-3003}}
  NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL: ${NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL:-/heri-africa}
  NEXT_PUBLIC_SCHOOL_PORTAL_ENABLED: ${NEXT_PUBLIC_SCHOOL_PORTAL_ENABLED:-true}

services:

  web:
    <<: *frontend-app
    ports:
      - "${PUBLIC_FRONTEND_PORT:-3000}:3000"
    environment:
      <<: *frontend-env
      FRONTEND_APP_DIR: apps/web
      FRONTEND_PORT: "3000"
      # Server-side rewrite target for /heri-africa/*. Resolves only when
      # heri-web is also running.
      KSU_HERI_FRONTEND_URL: ${KSU_HERI_FRONTEND_URL:-http://heri-web:3004}

  admin:
    <<: *frontend-app
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:3001"
    environment:
      <<: *frontend-env
      FRONTEND_APP_DIR: apps/admin
      FRONTEND_PORT: "3001"
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-KSU Admin}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${ADMIN_FRONTEND_PORT:-3001}}

  research-web:
    <<: *frontend-app
    ports:
      - "${RESEARCH_FRONTEND_PORT:-3002}:3002"
    environment:
      <<: *frontend-env
      FRONTEND_APP_DIR: apps/research
      FRONTEND_PORT: "3002"

  library-web:
    <<: *frontend-app
    ports:
      - "${LIBRARY_FRONTEND_PORT:-3003}:3003"
    environment:
      <<: *frontend-env
      FRONTEND_APP_DIR: apps/library
      FRONTEND_PORT: "3003"

  heri-web:
    <<: *frontend-app
    ports:
      - "${HERI_FRONTEND_PORT:-3004}:3004"
    environment:
      <<: *frontend-env
      FRONTEND_APP_DIR: apps/heri-africa
      FRONTEND_PORT: "3004"
      NEXT_BASE_PATH: ${NEXT_BASE_PATH:-/heri-africa}
