# VM deployment overlay for standard and Research VM deployments. Use with:
# docker compose --env-file .deploy/dev.compose.env -f docker-compose.yml -f docker-compose.vm.yml up -d
# Research routing is opt-in when running Compose directly:
# docker compose --profile research -f docker-compose.yml -f docker-compose.vm.yml up -d

x-frontend-healthcheck: &frontend-healthcheck
  test:
    [
      "CMD-SHELL",
      "node -e \"const http=require('http');const path=process.env.FRONTEND_HEALTH_PATH||'/';const req=http.get({host:'127.0.0.1',port:Number(process.env.PORT||3000),path},res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});\"",
    ]
  start_period: 30s
  interval: 30s
  timeout: 10s
  retries: 3

x-api-runtime-limits: &api-runtime-limits
  cpus: ${API_CPU_LIMIT:-1.0}
  mem_limit: ${API_MEMORY_LIMIT:-768m}
  pids_limit: ${API_PIDS_LIMIT:-256}

x-worker-runtime-limits: &worker-runtime-limits
  cpus: ${WORKER_CPU_LIMIT:-0.75}
  mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
  pids_limit: ${WORKER_PIDS_LIMIT:-192}

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  redis-cache:
    ports: !reset []

  main:
    <<: *api-runtime-limits
    ports: !reset []
    environment:
      APP_ENV: production
    command: ["uvicorn", "wsgi:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2,172.30.0.8", "--workers", "${API_WORKERS:-2}"]

  research:
    <<: *api-runtime-limits
    ports: !reset []
    environment:
      APP_ENV: production
    command: ["uvicorn", "wsgi:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2,172.30.0.8", "--workers", "${API_WORKERS:-2}"]

  library:
    <<: *api-runtime-limits
    ports: !reset []
    environment:
      APP_ENV: production
    command: ["uvicorn", "wsgi:app", "--host", "0.0.0.0", "--port", "8002", "--proxy-headers", "--forwarded-allow-ips", "172.30.0.2,172.30.0.8", "--workers", "${API_WORKERS:-2}"]

  heri:
    <<: *api-runtime-limits
    environment:
      APP_ENV: production

  celery-main:
    <<: *worker-runtime-limits

  celery-main-audit:
    <<: *worker-runtime-limits

  celery-main-integrations:
    <<: *worker-runtime-limits

  beat-main:
    <<: *worker-runtime-limits

  beat-library:
    <<: *worker-runtime-limits

  celery-research:
    <<: *worker-runtime-limits
    depends_on: !reset []

  celery-research-audit:
    <<: *worker-runtime-limits
    depends_on: !reset []

  beat-research:
    <<: *worker-runtime-limits
    depends_on: !reset []

  celery-library:
    <<: *worker-runtime-limits

  celery-library-audit:
    <<: *worker-runtime-limits

  celery-heri:
    <<: *worker-runtime-limits

  celery-heri-audit:
    <<: *worker-runtime-limits

  beat-heri:
    <<: *worker-runtime-limits

  edge:
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    environment:
      PUBLIC_SERVER_NAME: ${PUBLIC_SERVER_NAME:-_}
      API_SERVER_NAME: ${API_SERVER_NAME:-_}
      RESEARCH_SERVER_NAME: ${RESEARCH_SERVER_NAME:-_}
    volumes:
      - ./gateway/edge.vm.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      gateway:
        condition: service_started
      web-prod:
        condition: service_healthy
      heri-web-prod:
        condition: service_healthy
      admin-prod:
        condition: service_healthy
      research-web-prod:
        condition: service_healthy
      library-web-prod:
        condition: service_healthy
    networks: [ksu, proxy]
    restart: unless-stopped

  gateway:
    ports: !reset []

  # Research VM routing is kept here so the VM deployment uses one overlay.
  research-gateway:
    profiles: [research]
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/research.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      main:
        condition: service_healthy
      research:
        condition: service_healthy
      library:
        condition: service_healthy
    networks:
      ksu:
      api:
        ipv4_address: 172.30.0.8
    restart: unless-stopped

  research-edge:
    profiles: [research]
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    environment:
      RESEARCH_SERVER_NAME: ${RESEARCH_SERVER_NAME:-_}
    volumes:
      - ./gateway/edge.research.vm.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      research-gateway:
        condition: service_started
      admin-prod:
        condition: service_healthy
      research-web-prod:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  web-prod:
    image: ${FRONTEND_IMAGE_PREFIX:-ksu-frontend}/web-prod:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        APP_DIR: web
        PACKAGE_NAME: "@ksu/web"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL}
        NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL}
        NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL}
        KSU_MAIN_API_URL: ${VM_FRONTEND_BUILD_MAIN_API_URL:-http://gateway}
        KSU_RESEARCH_API_URL: ${VM_FRONTEND_BUILD_RESEARCH_API_URL:-http://gateway}
        KSU_LIBRARY_API_URL: ${VM_FRONTEND_BUILD_LIBRARY_API_URL:-http://gateway}
        KSU_HERI_FRONTEND_URL: ${VM_FRONTEND_BUILD_HERI_FRONTEND_URL:-http://heri-web-prod:3000}
        NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-/api/v1/heri}
        NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL}
        NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      FRONTEND_HEALTH_PATH: /
      NEXT_TELEMETRY_DISABLED: "1"
      KSU_MAIN_API_URL: ${KSU_MAIN_API_URL}
      KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL}
      KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL}
      KSU_HERI_FRONTEND_URL: ${KSU_HERI_FRONTEND_URL:-http://heri-web-prod:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ksu]
    restart: unless-stopped
    healthcheck: *frontend-healthcheck

  admin-prod:
    image: ${FRONTEND_IMAGE_PREFIX:-ksu-frontend}/admin-prod:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        APP_DIR: admin
        PACKAGE_NAME: "@ksu/admin"
        NEXT_BASE_PATH: /admin
        NEXT_OUTPUT_EXPORT: "0"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL}
        NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL}
        NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL}
        NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL}
        NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL}
        NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL: ${NEXT_PUBLIC_HERI_AFRICA_FRONTEND_URL}
        NEXT_PUBLIC_HERI_FRONTEND_URL: ${NEXT_PUBLIC_HERI_FRONTEND_URL:-}
        NEXT_PUBLIC_PUBLIC_FRONTEND_BASE_PATH: ${NEXT_PUBLIC_PUBLIC_FRONTEND_BASE_PATH:-}
        NEXT_PUBLIC_RESEARCH_FRONTEND_BASE_PATH: ${NEXT_PUBLIC_RESEARCH_FRONTEND_BASE_PATH:-}
        NEXT_PUBLIC_LIBRARY_FRONTEND_BASE_PATH: ${NEXT_PUBLIC_LIBRARY_FRONTEND_BASE_PATH:-/library}
        NEXT_PUBLIC_HERI_AFRICA_FRONTEND_BASE_PATH: ${NEXT_PUBLIC_HERI_AFRICA_FRONTEND_BASE_PATH:-/heri-africa}
        NEXT_PUBLIC_HERI_FRONTEND_BASE_PATH: ${NEXT_PUBLIC_HERI_FRONTEND_BASE_PATH:-}
        KSU_MAIN_API_URL: ${VM_FRONTEND_BUILD_MAIN_API_URL:-http://gateway}
        KSU_RESEARCH_API_URL: ${VM_FRONTEND_BUILD_RESEARCH_API_URL:-http://gateway}
        KSU_LIBRARY_API_URL: ${VM_FRONTEND_BUILD_LIBRARY_API_URL:-http://gateway}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      FRONTEND_HEALTH_PATH: /admin/
      NEXT_TELEMETRY_DISABLED: "1"
      KSU_MAIN_API_URL: ${KSU_MAIN_API_URL}
      KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL}
      KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ksu]
    restart: unless-stopped
    healthcheck: *frontend-healthcheck

  research-web-prod:
    image: ${FRONTEND_IMAGE_PREFIX:-ksu-frontend}/research-web-prod:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        APP_DIR: research
        PACKAGE_NAME: "@ksu/research"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL}
        NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL}
        NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL}
        KSU_MAIN_API_URL: ${VM_FRONTEND_BUILD_MAIN_API_URL:-http://gateway}
        KSU_RESEARCH_API_URL: ${VM_FRONTEND_BUILD_RESEARCH_API_URL:-http://gateway}
        KSU_LIBRARY_API_URL: ${VM_FRONTEND_BUILD_LIBRARY_API_URL:-http://gateway}
        NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL}
        NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      FRONTEND_HEALTH_PATH: /
      NEXT_TELEMETRY_DISABLED: "1"
      KSU_MAIN_API_URL: ${KSU_MAIN_API_URL}
      KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL}
      KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ksu]
    restart: unless-stopped
    healthcheck: *frontend-healthcheck

  library-web-prod:
    image: ${FRONTEND_IMAGE_PREFIX:-ksu-frontend}/library-web-prod:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        APP_DIR: library
        PACKAGE_NAME: "@ksu/library"
        NEXT_BASE_PATH: /library
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAIN_API_URL: ${NEXT_PUBLIC_MAIN_API_URL}
        NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL}
        NEXT_PUBLIC_LIBRARY_API_URL: ${NEXT_PUBLIC_LIBRARY_API_URL}
        KSU_MAIN_API_URL: ${VM_FRONTEND_BUILD_MAIN_API_URL:-http://gateway}
        KSU_RESEARCH_API_URL: ${VM_FRONTEND_BUILD_RESEARCH_API_URL:-http://gateway}
        KSU_LIBRARY_API_URL: ${VM_FRONTEND_BUILD_LIBRARY_API_URL:-http://gateway}
        NEXT_PUBLIC_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_RESEARCH_FRONTEND_URL: ${NEXT_PUBLIC_RESEARCH_FRONTEND_URL}
        NEXT_PUBLIC_LIBRARY_FRONTEND_URL: ${NEXT_PUBLIC_LIBRARY_FRONTEND_URL}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      FRONTEND_HEALTH_PATH: /library/
      NEXT_TELEMETRY_DISABLED: "1"
      KSU_MAIN_API_URL: ${KSU_MAIN_API_URL}
      KSU_RESEARCH_API_URL: ${KSU_RESEARCH_API_URL}
      KSU_LIBRARY_API_URL: ${KSU_LIBRARY_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ksu]
    restart: unless-stopped
    healthcheck: *frontend-healthcheck

  heri-web-prod:
    image: ${FRONTEND_IMAGE_PREFIX:-ksu-frontend}/heri-web-prod:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        APP_DIR: heri-africa
        PACKAGE_NAME: "@ksu/heri-africa"
        NEXT_BASE_PATH: /heri-africa
        KSU_HERI_API_URL: ${VM_FRONTEND_BUILD_HERI_API_URL:-http://gateway}
        NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-/api/v1/heri}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      FRONTEND_HEALTH_PATH: /heri-africa/
      NEXT_BASE_PATH: /heri-africa
      NEXT_TELEMETRY_DISABLED: "1"
      KSU_HERI_API_URL: ${KSU_HERI_API_URL:-http://gateway}
      NEXT_PUBLIC_HERI_API_URL: ${NEXT_PUBLIC_HERI_API_URL:-/api/v1/heri}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ksu]
    restart: unless-stopped
    healthcheck: *frontend-healthcheck
