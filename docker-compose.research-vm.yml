# Research-only VM deployment overlay. Use after docker-compose.yml and docker-compose.vm.yml.

services:
  main:
    ports: !reset []
    environment:
      APP_ENV: production

  research:
    ports: !reset []
    environment:
      APP_ENV: production

  library:
    ports: !reset []
    environment:
      APP_ENV: production

  heri:
    environment:
      APP_ENV: production

  celery-research:
    depends_on: !reset []

  research-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/research.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      main:
        condition: service_healthy
      research:
        condition: service_healthy
      library:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped

  research-edge:
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    environment:
      RESEARCH_SERVER_NAME: ${RESEARCH_SERVER_NAME:-_}
    volumes:
      - ./gateway/edge.research.vm.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      research-gateway:
        condition: service_started
      admin-prod:
        condition: service_healthy
      research-web-prod:
        condition: service_healthy
    networks: [ksu]
    restart: unless-stopped
