# Optional developer-only host ports. Never use this overlay for VM or production deployments.
services:
  gateway:
    ports:
      - "${GATEWAY_PORT:-8080}:80"
  main:
    ports:
      - "127.0.0.1:${MAIN_SERVICE_PORT:-8000}:8000"
    environment:
      APP_ENV: development
      JWT_SIGNING_ENABLED: "true"
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?JWT_PRIVATE_KEY_B64 is required}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      INTERNAL_API_KEY: change-me-internal # pragma: allowlist secret
      RESEARCH_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      LIBRARY_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://localhost:3003"]'
  research:
    ports:
      - "127.0.0.1:${RESEARCH_SERVICE_PORT:-8001}:8001"
    environment:
      APP_ENV: development
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      MAIN_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      INTERNAL_API_KEY: change-me-internal # pragma: allowlist secret
      REFERENCE_VALIDATION_MODE: warn
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://localhost:3003"]'
  library:
    ports:
      - "127.0.0.1:${LIBRARY_SERVICE_PORT:-8002}:8002"
    environment:
      APP_ENV: development
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      MAIN_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      INTERNAL_API_KEY: change-me-internal # pragma: allowlist secret
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://localhost:3003"]'
  heri:
    environment:
      APP_ENV: development
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      RESEARCH_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      MAIN_SERVICE_URL: http://main:8000
      MAIN_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3004"]'
  celery-main:
    environment:
      APP_ENV: development
      JWT_SIGNING_ENABLED: "false"
      JWT_PRIVATE_KEY_B64: ""
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      INTERNAL_API_KEY: change-me-internal # pragma: allowlist secret
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://localhost:3003"]'
  celery-library:
    environment:
      APP_ENV: development
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      INTERNAL_API_KEY: change-me-internal # pragma: allowlist secret
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://localhost:3003"]'
  celery-research:
    environment:
      APP_ENV: development
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      MAIN_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      INTERNAL_API_KEY: change-me-internal # pragma: allowlist secret
      REFERENCE_VALIDATION_MODE: warn
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://localhost:3003"]'
  celery-heri:
    environment:
      APP_ENV: development
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?JWT_PUBLIC_KEY_B64 is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-active-key}
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-ksu-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ksu-platform}
      RESEARCH_SERVICE_API_KEY: change-me-internal # pragma: allowlist secret
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "http://localhost:3004"]'
