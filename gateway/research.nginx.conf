upstream main_api     { server main:8000;     keepalive 32; }
upstream research_api { server research:8001;  keepalive 32; }
upstream library_api  { server library:8002;   keepalive 32; }

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;
    large_client_header_buffers 8 32k;

    location = / {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"research-api-gateway"}';
    }

    location = /docs {
        proxy_pass         http://main_api/api/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location = /openapi.json {
        proxy_pass         http://main_api/api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location ~ ^/api/(docs|openapi\.json)$ {
        proxy_pass         http://main_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location ~ ^/api/v1/(analytics|ask-ai|centers|consultancies|donation-impacts|donation-settings|donation-stories|donations|donors|endowments|expertise-tags|exports|farms|focus-areas|funders|grant-applications|grant-guidelines|grant-reports|grant-reviews|grants|guidelines|impact-metrics|innovations|journals|mentorship|mentorship-applications|mentorship-matches|outputs|partners|programs|projects|publications|realtime|research|research-programs|research-themes|resources|scholarship-applications|scholarships|services|stories|sustainability|themes|training|external-research) {
        proxy_pass         http://research_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location ~ ^/api/v1/(library|my/library) {
        proxy_pass         http://library_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location ~ ^/api/v1/internal {
        return 403;
    }

    location /api/v1/ {
        proxy_pass         http://main_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
