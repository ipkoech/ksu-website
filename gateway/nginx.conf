# Realtime fan-out goes through Redis pub/sub, so every worker sees every event
# and a WebSocket does not need to return to the same backend. ip_hash would
# only cost balance.
upstream main_api     { server main:8000;     keepalive 32; }
upstream research_api { server research:8001;  keepalive 32; }
upstream library_api  { server library:8002;   keepalive 32; }
upstream heri_api     { server heri:8003;      keepalive 32; }

# Shed floods at the edge. Without these a rejected request still costs a Python
# worker slot, a Redis round trip, and a database connection before the
# application's own rate limiter can answer.
#
# These are deliberately loose. Campus traffic arrives NAT'd behind a small
# number of public addresses, so a per-address limit tight enough to stop one
# abusive client would also lock out everyone on campus wifi. The intent is to
# stop a single-source flood, not to do per-user fairness — the application's
# own per-user limiters do that. Tune against real edge logs before tightening,
# and add the campus egress ranges to a geo-based exemption if they ever trip.
limit_req_zone  $binary_remote_addr zone=api_general:16m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:16m;

limit_req_status  429;
limit_conn_status 429;

gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        application/json application/javascript application/xml
                  text/css text/plain text/xml image/svg+xml;

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Burst absorbs normal page bursts; nodelay serves them immediately and
    # only sustained excess is rejected. The connection cap sits well above the
    # realtime service's own 20-per-address WebSocket limit so a legitimate
    # client holding sockets open is never the one that trips it.
    limit_req  zone=api_general burst=200 nodelay;
    limit_conn api_conn 200;
    large_client_header_buffers 8 32k;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;

    # ── API hostname landing and documentation ───────────────────────────────
    location = / {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location = /docs {
        proxy_pass         http://main_api/api/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location = /openapi.json {
        proxy_pass         http://main_api/api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location ~ ^/api/(docs|openapi\.json)$ {
        proxy_pass         http://main_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Main-service CSV exports ──────────────────────────────────────────────
    # Must precede the research block: research also owns /api/v1/exports, but
    # main's per-resource CSV exports are the "{resource}.csv" form only.
    location ~ ^/api/v1/exports/[a-z0-9-]+\.csv$ {
        proxy_pass         http://main_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Internal endpoints — block every nested internal path from the public gateway ──
    # This covers both /api/v1/internal/* and service-specific forms such as
    # /api/v1/stats/internal/* before any service routing regex can match.
    location ~ ^/api/v1(?:/[^/]+)*/internal(?:/|$) {
        return 403;
    }

    # ── Research service ──────────────────────────────────────────────────────
    # NOTE: main's /api/v1/stories is served by main_api (falls through to the
    # main-site location below). Research has no top-level stories router.
    # /api/v1/search, /api/v1/analytics, and /api/v1/stats belong to the main
    # service; the research equivalents are namespaced under /api/v1/research/
    # (search, analytics, stats aliases) and matched by the "research" prefix.
    location ~ ^/api/v1/(research|projects|centers|farms|programs|themes|focus-areas|expertise-tags|grants|grant-guidelines|grant-applications|funders|endowments|grant-reviews|grant-reports|publications|journals|school-publications|innovations|outputs|startups|incubation-records|competition-entries|technology-transfer-cases|training|mentorship|mentorship-applications|mentorship-matches|scholarships|scholarship-applications|partners|consultancies|impact-metrics|sustainability|resources|services|guidelines|ask-ai|exports|donors|donations|donation-impacts|donation-stories|donation-settings|research-programs|research-themes|external-research)(?:/|$) {
        proxy_pass         http://research_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Library service ───────────────────────────────────────────────────────
    location ~ ^/api/v1/(library|my/library) {
        proxy_pass         http://library_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── HERI Africa service ───────────────────────────────────────────────────
    location ~ ^/api/v1/heri(?:/|$) {
        proxy_pass         http://heri_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Main site service ────────────────────────────────────────────────────
    location = /api/v1/realtime {
        proxy_pass         http://main_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering    off;
    }

    location /api/v1/ {
        proxy_pass         http://main_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Public media uploaded through the main service ───────────────────────
    # Main still authorizes every upload (it checks the Media row is public and
    # not deleted) but answers with X-Accel-Redirect instead of the bytes, so
    # nginx streams the file. Without this a page of 20 images costs 20 Python
    # requests and 20 database queries against a pool of 5.
    location /uploads/ {
        proxy_pass         http://main_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Only reachable through an X-Accel-Redirect from main, never directly.
    location /internal-uploads/ {
        internal;
        alias /var/www/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Health check (gateway level) ─────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
