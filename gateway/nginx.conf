upstream main_api     { server main:8000;     keepalive 32; }
upstream research_api { server research:8001;  keepalive 32; }
upstream library_api  { server library:8002;   keepalive 32; }

# Flask monolith — kept alive during migration, removed once Phase 3 completes
upstream legacy_api   { server legacy:5000;    keepalive 32; }

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # ── Research service ──────────────────────────────────────────────────────
    location ~ ^/api/v1/(research|publications|research-programs|research-themes|external-research) {
        proxy_pass         http://research_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Library service ───────────────────────────────────────────────────────
    location ~ ^/api/v1/(library|my/library) {
        proxy_pass         http://library_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Internal endpoints — block from public internet ───────────────────────
    location ~ ^/api/v1/internal {
        return 403;
    }

    # ── Main site service (migrated routes) ───────────────────────────────────
    # Uncomment each block as Phase 3 migration waves complete:

    # Wave 1 — Auth + Person (Weeks 12–13)
    # location ~ ^/api/v1/(auth|persons|leadership|organogram) {
    #     proxy_pass http://main_api;
    #     ...
    # }

    # Wave 2 — Academic + Programme (Weeks 13–14)
    # location ~ ^/api/v1/(academic|campuses|schools|departments|programmes|admissions|capacity) {
    #     proxy_pass http://main_api;
    #     ...
    # }

    # ── Legacy Flask monolith — catch-all until full migration ────────────────
    location /api/v1/ {
        proxy_pass         http://legacy_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Health check (gateway level) ─────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
