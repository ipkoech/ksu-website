name: Research Admin Verification
# rerun after lint fixes
# rerun after type-contract fixes

on:
  push:
    branches:
      - feat/research-admin-product-completion
    paths:
      - '.github/workflows/research-admin-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Normalize shared public links in runner
        shell: bash
        run: |
          set -euo pipefail
          for app in frontend/apps/*; do
            [ -d "$app" ] || continue
            if [ -e "$app/public" ] || [ -L "$app/public" ]; then
              rm -rf "$app/public"
            fi
          done

      - name: Research lint
        run: pnpm --dir frontend --filter @ksu/research lint

      - name: Research typecheck
        run: pnpm --dir frontend --filter @ksu/research typecheck

      - name: Research tests
        run: pnpm --dir frontend --filter @ksu/research test

      - name: Research Admin API-client tests
        working-directory: frontend/packages/api-client
        run: >
          pnpm exec vitest run
          src/research/admin-contract.test.ts
          src/research/admin-form-recovery.test.ts
          src/research/admin-main-account.test.ts
          src/research/admin-product.test.ts
          src/research/admin-read-integrity.test.ts
          src/research/admin-reliability.test.ts
          src/research/admin-retry-integrity.test.ts
          --maxWorkers=1 --minWorkers=1 --testTimeout=10000

      - name: Research production build
        run: pnpm --dir frontend --filter @ksu/research build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Research Admin browser fault injection
        id: browser
        continue-on-error: true
        working-directory: frontend/apps/research
        run: pnpm exec playwright test --config=playwright.admin.config.ts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e "./services/common[test]" -e "./services/contracts" -e "./services/main[test]" -e "./services/research[test]"

      - name: Research backend suite
        id: research_backend
        continue-on-error: true
        run: python scripts/run_backend_tests.py research

      - name: Main backend suite
        id: main_backend
        continue-on-error: true
        run: python scripts/run_backend_tests.py main

      - name: Shared backend suites
        id: shared_backend
        continue-on-error: true
        run: python scripts/run_backend_tests.py common contracts

      - name: Research source Ruff
        id: ruff
        continue-on-error: true
        run: >
          ruff check
          services/research/app/core/admin_expected_actor.py
          services/research/app/routes/v1/admin_workspace.py
          services/research/app/routes/v1/admin_workspace_export.py
          services/research/app/routes/v1/admin_workspace_operations.py
          services/research/app/routes/v1/admin_workspace_receipts.py
          services/research/app/services/admin_workspace.py
          services/research/app/services/admin_workspace_export.py
          services/research/app/services/admin_workspace_operations.py
          services/research/app/services/admin_workspace_policy.py
          services/research/app/services/admin_workspace_query.py
          services/research/app/services/admin_workspace_receipts.py
          services/research/app/services/admin_workspace_reconciliation.py
          services/research/app/services/admin_workspace_registry.py
          services/research/app/services/admin_workspace_revision.py
          services/research/app/services/admin_workspace_schema.py
          services/research/app/services/admin_workspace_write_scope.py
          services/main/app/core/workspace_actor.py
          services/main/tests/test_workspace_actor.py
          services/research/tests/test_admin_native_write_scope.py
          services/research/tests/test_admin_pathway_lock.py
          services/research/tests/test_admin_workspace_policy.py
          services/research/tests/test_admin_workspace_registration.py

      - name: Enforce aggregate verification
        if: always()
        shell: bash
        run: |
          test "${{ steps.browser.outcome }}" = "success"
          test "${{ steps.research_backend.outcome }}" = "success"
          test "${{ steps.main_backend.outcome }}" = "success"
          test "${{ steps.shared_backend.outcome }}" = "success"
          test "${{ steps.ruff.outcome }}" = "success"
