name: Quality and Security

on:
  pull_request:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check -r requirements/ci.txt
      - name: Validate repository syntax
        run: |
          git diff --check
          python -m compileall -q scripts services/common/ksu_common
      - name: Scan newly committed content for secrets
        run: |
          git diff --diff-filter=ACMR --name-only -z HEAD^ HEAD | xargs -0 -r detect-secrets-hook --baseline .secrets.baseline
      - name: Enforce Ruff baseline
        run: |
          python scripts/ruff_baseline.py check --baseline .ruff-baseline.json --paths .
      - name: Validate Compose production topology
        env:
          POSTGRES_PASSWORD: ci-only-not-a-production-secret # pragma: allowlist secret
          MAIN_DB_PASSWORD: ci-only-main-password # pragma: allowlist secret
          RESEARCH_DB_PASSWORD: ci-only-research-password # pragma: allowlist secret
          LIBRARY_DB_PASSWORD: ci-only-library-password # pragma: allowlist secret
          HERI_DB_PASSWORD: ci-only-heri-password # pragma: allowlist secret
          JWT_PRIVATE_KEY_B64: ci-private-key-material # pragma: allowlist secret
          JWT_PUBLIC_KEY_B64: ci-public-key-material
          JWT_KEY_ID: ci-active-key
        run: |
          for service in main research library heri_africa; do
            cp "services/${service}/.env.example" "services/${service}/.env"
          done
          docker compose -f docker-compose.yml -f docker-compose.vm.yml config >/tmp/ksu-compose.yaml
          python scripts/audit_compose_ports.py docker-compose.yml docker-compose.vm.yml
          python scripts/validate_database_capacity.py
          python scripts/validate_traffic_scaling.py
      - name: Validate production settings fail closed
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@postgres:5432/ci # pragma: allowlist secret
          REDIS_URL: rediss://redis:6379/0
          JWT_PRIVATE_KEY_B64: ci-private-key-material # pragma: allowlist secret
          JWT_PUBLIC_KEY_B64: ci-public-key-material
          JWT_KEY_ID: ci-active-key
          JWT_ALGORITHM: RS256
          JWT_ISSUER: ksu-auth-ci
          JWT_AUDIENCE: ksu-platform-ci
          INTERNAL_API_KEY: ci-internal-key-at-least-thirty-two-characters # pragma: allowlist secret
          CORS_ORIGINS: '["https://www.example.edu"]'
          SMTP_HOST: smtp.example.edu
          SMTP_PASSWORD: ci-smtp-password-at-least-thirty-two-characters # pragma: allowlist secret
          EMAIL_FROM: noreply@example.edu
        run: |
          python scripts/validate_production_env.py --env production --service main
          if DEBUG=true python scripts/validate_production_env.py --env production --service main; then
            echo "production DEBUG validation unexpectedly passed" >&2
            exit 1
          fi
      - name: Inspect Dockerfiles for root runtime
        run: |
          ! rg -n '^USER root$|^USER 0$' services/*/Dockerfile frontend/Dockerfile

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [common, contracts, main, research, library, heri_africa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.service }}" = contracts ]; then
            pip install -e ../common
          elif [ "${{ matrix.service }}" != common ]; then
            pip install -e ../common -e ../contracts
          fi
          pip install -e ".[test]" -r ../../requirements/ci.txt
      - name: Compile
        working-directory: services/${{ matrix.service }}
        run: python -m compileall -q .
      - name: Ruff regression check
        run: python scripts/ruff_baseline.py check --baseline .ruff-baseline.json --paths services/${{ matrix.service }}
      - name: Check installed dependencies
        working-directory: services/${{ matrix.service }}
        run: pip check
      - name: Audit dependencies
        working-directory: services/${{ matrix.service }}
        run: pip-audit

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all backend services
        run: |
          python -m pip install --upgrade pip
          pip install -e services/common
          pip install -e services/contracts
          pip install -e services/main -e services/research -e services/library -e services/heri_africa
      - name: Verify applications and structural baseline
        run: python scripts/structural_snapshot.py /tmp/ksu-structure.json --expect scripts/structural-baseline.json

  request-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install request-path dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e services/common
          pip install -e services/contracts
          pip install -e services/main -e services/research
      - name: Exercise request binding and serialization
        run: |
          python scripts/request_correctness_smoke.py
          python scripts/integration_infrastructure_smoke.py

  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [main, research, library, heri_africa]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ../common
          pip install -e ../contracts
          pip install -e .
      - name: Validate migration history and source
        run: python scripts/ci_environment.py "${{ matrix.service }}" -- scripts/validate_migrations.sh "${{ matrix.service }}"

  database-ownership:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ksu_ownership_ci
          POSTGRES_USER: ksu_admin
          POSTGRES_PASSWORD: ci-admin-password # pragma: allowlist secret
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ksu_admin -d ksu_ownership_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Provision isolated service roles
        env:
          POSTGRES_DB: ksu_ownership_ci
          DATABASE_ADMIN_USER: ksu_admin
          DATABASE_ADMIN_PASSWORD: ci-admin-password # pragma: allowlist secret
          DATABASE_HOST: 127.0.0.1
          MAIN_DB_PASSWORD: ci-main-password # pragma: allowlist secret
          RESEARCH_DB_PASSWORD: ci-research-password # pragma: allowlist secret
          LIBRARY_DB_PASSWORD: ci-library-password # pragma: allowlist secret
          HERI_DB_PASSWORD: ci-heri-password # pragma: allowlist secret
        run: |
          scripts/init-database-ownership.sh
          for pair in "ksu_main main" "ksu_research research" "ksu_library library" "ksu_heri heri"; do
            read -r role schema <<<"$pair"
            PGPASSWORD="$DATABASE_ADMIN_PASSWORD" psql -X -h "$DATABASE_HOST" -U "$DATABASE_ADMIN_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 -c "SET ROLE ${role}; CREATE TABLE ${schema}.ownership_probe (id bigint PRIMARY KEY); INSERT INTO ${schema}.ownership_probe VALUES (1)"
          done
          PGPASSWORD="$DATABASE_ADMIN_PASSWORD" psql -X -h "$DATABASE_HOST" -U "$DATABASE_ADMIN_USER" -d "$POSTGRES_DB" -c \
            "SET ROLE ksu_main; CREATE TABLE main.alembic_version (version_num varchar(32) PRIMARY KEY); INSERT INTO main.alembic_version VALUES ('20260809_0800')"
          PGPASSWORD="$DATABASE_ADMIN_PASSWORD" psql -X -h "$DATABASE_HOST" -U "$DATABASE_ADMIN_USER" -d "$POSTGRES_DB" -c \
            "SET ROLE ksu_research; CREATE TABLE research.alembic_version (version_num varchar(32) PRIMARY KEY); INSERT INTO research.alembic_version VALUES ('20260805_0012')"
          PGPASSWORD="$DATABASE_ADMIN_PASSWORD" psql -X -h "$DATABASE_HOST" -U "$DATABASE_ADMIN_USER" -d "$POSTGRES_DB" -c \
            "SET ROLE ksu_library; CREATE TABLE library.alembic_version (version_num varchar(32) PRIMARY KEY); INSERT INTO library.alembic_version VALUES ('20260807_0010')"
          PGPASSWORD="$DATABASE_ADMIN_PASSWORD" psql -X -h "$DATABASE_HOST" -U "$DATABASE_ADMIN_USER" -d "$POSTGRES_DB" -c \
            "SET ROLE ksu_heri; CREATE TABLE heri.alembic_version (version_num varchar(32) PRIMARY KEY); INSERT INTO heri.alembic_version VALUES ('0006_command_idempotency')"
      - name: Prove ownership and deny cross-schema access
        env:
          DATABASE_ADMIN_URL: postgresql://ksu_admin:ci-admin-password@127.0.0.1:5432/ksu_ownership_ci # pragma: allowlist secret
        run: python scripts/verify_database_ownership.py
      - name: Create and restore a checksummed backup
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_DB: ksu_ownership_ci
          POSTGRES_USER: ksu_admin
          POSTGRES_PASSWORD: ci-admin-password # pragma: allowlist secret
          BACKUP_DIR: /tmp/ksu-backups
          APP_ENV: ci
          RECOVERY_DB: ksu_recovery_ci
          RECOVERY_USER: ksu_admin
          RECOVERY_PASSWORD: ci-admin-password # pragma: allowlist secret
          RECOVERY_HOST: 127.0.0.1
          RECOVERY_ADMIN_URL: postgresql://ksu_admin:ci-admin-password@127.0.0.1:5432/ksu_recovery_ci # pragma: allowlist secret
          MAIN_DB_PASSWORD: ci-main-password # pragma: allowlist secret
          RESEARCH_DB_PASSWORD: ci-research-password # pragma: allowlist secret
          LIBRARY_DB_PASSWORD: ci-library-password # pragma: allowlist secret
          HERI_DB_PASSWORD: ci-heri-password # pragma: allowlist secret
        run: |
          scripts/backup_database.sh
          PGPASSWORD="$POSTGRES_PASSWORD" createdb -h "$POSTGRES_HOST" -U "$POSTGRES_USER" "$RECOVERY_DB"
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -name '*.dump' -print -quit)" scripts/test_database_restore.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ksu_ci
          POSTGRES_USER: ksu_ci
          POSTGRES_PASSWORD: ksu_ci_password # pragma: allowlist secret
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ksu_ci -d ksu_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real service test dependencies
        run: pip install asyncpg redis
      - name: Verify PostgreSQL and Redis connectivity
        env:
          DATABASE_URL: postgresql://ksu_ci:ksu_ci_password@127.0.0.1:5432/ksu_ci # pragma: allowlist secret
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg
          import redis.asyncio as redis

          async def main():
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  assert await connection.fetchval("SELECT 1") == 1
              finally:
                  await connection.close()
              client = redis.from_url(os.environ["REDIS_URL"])
              try:
                  assert await client.ping()
              finally:
                  await client.aclose()

          asyncio.run(main())
          PY

  images:
    runs-on: ubuntu-latest
    needs: [repository]
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend images
        env:
          POSTGRES_PASSWORD: ci-only-not-a-production-secret # pragma: allowlist secret
          MAIN_DB_PASSWORD: ci-only-main-password # pragma: allowlist secret
          RESEARCH_DB_PASSWORD: ci-only-research-password # pragma: allowlist secret
          LIBRARY_DB_PASSWORD: ci-only-library-password # pragma: allowlist secret
          HERI_DB_PASSWORD: ci-only-heri-password # pragma: allowlist secret
        run: docker compose -f docker-compose.yml -f docker-compose.vm.yml build main research library heri
      - name: Scan Main image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ksu-backend/main:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan Research image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ksu-backend/research:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan Library image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ksu-backend/library:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan HERI Africa image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ksu-backend/heri-africa:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
