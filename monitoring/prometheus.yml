global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ksu-http-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - main:8000
          - research:8001
          - library:8002
          - heri:8003

  - job_name: ksu-celery-workers
    static_configs:
      - targets:
          - celery-main:9100
          - celery-library:9101
          - celery-research:9102
          - celery-heri:9103

  - job_name: ksu-postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: ksu-redis-broker
    static_configs:
      - targets: [redis-exporter:9121]
        labels:
          redis_role: broker

  - job_name: ksu-redis-cache
    static_configs:
      - targets: [redis-cache-exporter:9121]
        labels:
          redis_role: cache
